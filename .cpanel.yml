# Deployment tasks untuk cPanel > Git Version Control > "Deploy HEAD Commit".
# Sesuaikan VENV & APPDIR dengan yang tampil di cPanel > Setup Python App
# (baris "source /home/USER/virtualenv/.../bin/activate" pada info aplikasi).
---
deployment:
  tasks:
    - export VENV="$HOME/virtualenv/repos/pos/backend/3.12"
    - export APPDIR="$HOME/repos/pos/backend"
    - $VENV/bin/pip install -r $APPDIR/requirements.txt
    - cd $APPDIR && $VENV/bin/alembic upgrade head
    - touch $APPDIR/passenger_wsgi.py
